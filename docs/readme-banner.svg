<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#1a1033"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#76e5b5"/><stop offset="1" stop-color="#4aa8ff"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb84a"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.7"><stop offset="0" stop-color="#4aa8ff" stop-opacity="0.28"/><stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="20" fill="url(#glow)"/>

  <text x="50" y="62" font-size="20" font-weight="600" fill="#8a94b0" letter-spacing="4">POORMANSLLAMA</text>
  <text x="50" y="140" font-size="66" font-weight="800" fill="url(#acc)">35B model <tspan fill="#fff">on 8 GB VRAM</tspan></text>
  <text x="50" y="190" font-size="30" font-weight="600" fill="#c9d1ea">with the <tspan fill="url(#hot)" font-weight="800">full 262K context</tspan></text>

  <rect x="50" y="225" width="530" height="120" rx="18" fill="#fff" fill-opacity="0.06" stroke="#76e5b5" stroke-opacity="0.55" stroke-width="2"/>
  <text x="76" y="305" font-size="72" font-weight="800" fill="url(#acc)">600+</text>
  <text x="300" y="285" font-size="24" font-weight="700" fill="#fff">tok/s</text>
  <text x="300" y="315" font-size="22" fill="#c9d1ea">prefill</text>

  <rect x="620" y="225" width="530" height="120" rx="18" fill="#fff" fill-opacity="0.06" stroke="#ffb84a" stroke-opacity="0.55" stroke-width="2"/>
  <text x="646" y="305" font-size="72" font-weight="800" fill="url(#hot)">30+</text>
  <text x="840" y="285" font-size="24" font-weight="700" fill="#fff">tok/s</text>
  <text x="840" y="315" font-size="22" fill="#c9d1ea">generation</text>

  <text x="50" y="378" font-size="17" fill="#6c7693">Layer-residency CUDA prefill for llama.cpp · MoE experts streamed through a bounded VRAM window</text>
